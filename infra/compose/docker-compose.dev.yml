services:
  backend:
    build: ../../apps/backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  worker:
    build: ../../apps/worker
    depends_on:
      - redis
  frontend:
    build: ../../apps/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: chatflow
      POSTGRES_DB: chatflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
